<!-- Accessibility Zoom Widget (font size control, fixed on every page) -->
<div class="accessibility-widget" id="accessibility-widget" role="group" aria-label="Control de accesibilidad: tamaño de letra">
    <button type="button" class="acc-btn acc-btn-decrease" id="acc-decrease" title="Disminuir tamaño de letra" aria-label="Disminuir tamaño de letra">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
    </button>
    <button type="button" class="acc-btn acc-btn-value" id="acc-value" title="Restablecer tamaño de letra" aria-label="Tamaño de letra actual. Clic para restablecer">
        100%
    </button>
    <button type="button" class="acc-btn acc-btn-increase" id="acc-increase" title="Aumentar tamaño de letra" aria-label="Aumentar tamaño de letra">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
    </button>
</div>
